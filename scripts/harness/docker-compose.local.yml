# Local harness runtime in Docker (TCBR-shaped). No CloudBase deploy.
#
#   npm run build --workspace=packages/agent-runtime
#   docker compose -f scripts/harness/docker-compose.local.yml up --build
#
# Uses only existing runtime env: OAK_USE_MEMORY_STORE, AGENT_CONFIG, PORT.
services:
  harness-runtime:
    platform: linux/amd64
    build:
      context: ../../packages/agent-runtime
      dockerfile: Dockerfile
    ports:
      - "19090:8080"
    environment:
      PORT: "8080"
      OAK_USE_MEMORY_STORE: "1"
      CLOUDBASE_ENV_ID: local-docker
      AGENT_CONFIG: >-
        {"name":"HarnessDocker","runtime":"harness","engine":"opencode","system":"Docker local smoke agent."}
