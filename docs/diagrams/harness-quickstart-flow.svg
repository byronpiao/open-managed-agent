<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #1e293b; }
    .step-label { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .step-desc { font-size: 11px; fill: #64748b; }
    .note { font-size: 11px; fill: #94a3b8; }
  </style>
  <rect width="960" height="520" fill="#f8f6f3"/>
  <text x="480" y="50" text-anchor="middle" class="title">沙箱内 Agent 快速开始</text>

  <!-- Row 1: Prerequisites -->
  <text x="80" y="110" class="note">准备工作（一次）</text>
  <rect x="60" y="125" width="180" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="150" y="148" text-anchor="middle" class="step-label">magent login</text>
  <text x="150" y="166" text-anchor="middle" class="step-desc">tcb env use &lt;ID&gt;</text>

  <rect x="280" y="125" width="200" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="148" text-anchor="middle" class="step-label">check-harness-ready</text>
  <text x="380" y="166" text-anchor="middle" class="step-desc">环境检测</text>

  <line x1="240" y1="153" x2="272" y2="153" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Configuration -->
  <text x="80" y="230" class="note">配置</text>
  <rect x="60" y="245" width="220" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="268" text-anchor="middle" class="step-label">agent.harness.yaml</text>
  <text x="170" y="286" text-anchor="middle" class="step-desc">编写 Agent 配置（引擎/模型/工具）</text>

  <line x1="380" y1="181" x2="380" y2="237" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Row 3: Build & Deploy -->
  <text x="80" y="340" class="note">构建与部署</text>
  <rect x="60" y="355" width="180" height="56" rx="8" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <text x="150" y="378" text-anchor="middle" class="step-label" fill="#ffffff">npm run build</text>
  <text x="150" y="396" text-anchor="middle" class="step-desc" fill="#c7d2fe">编译运行时</text>

  <rect x="280" y="355" width="220" height="56" rx="8" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <text x="390" y="378" text-anchor="middle" class="step-label" fill="#ffffff">magent agent:create</text>
  <text x="390" y="396" text-anchor="middle" class="step-desc" fill="#c7d2fe">部署到 CloudBase</text>

  <line x1="240" y1="383" x2="272" y2="383" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="301" x2="170" y2="347" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Row 4: Run -->
  <rect x="60" y="440" width="370" height="52" rx="8" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="245" y="462" text-anchor="middle" class="step-label" fill="#ffffff">magent run -a &lt;ID&gt; -m "你的问题"</text>
  <text x="245" y="480" text-anchor="middle" class="step-desc" fill="#a7f3d0">Agent 在沙箱中执行</text>

  <line x1="390" y1="411" x2="390" y2="432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Sandbox visual -->
  <rect x="520" y="280" width="380" height="160" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="710" y="310" text-anchor="middle" class="step-label">CloudBase 沙箱</text>
  <rect x="560" y="330" width="300" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="710" y="354" text-anchor="middle" class="step-desc">OpenCode / Claude Code 运行中</text>
  <rect x="560" y="380" width="140" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="630" y="404" text-anchor="middle" class="step-desc">读写文件</text>
  <rect x="720" y="380" width="140" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="790" y="404" text-anchor="middle" class="step-desc">执行命令</text>

  <line x1="430" y1="466" x2="520" y2="360" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

</svg>