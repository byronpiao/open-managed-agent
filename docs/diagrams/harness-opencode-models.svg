<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .t { font-size: 22px; font-weight: 700; fill: #1e293b; }
    .l { font-size: 14px; font-weight: 600; fill: #1e293b; }
    .d { font-size: 12px; fill: #64748b; }
  </style>
  <rect width="960" height="420" fill="#f8f6f3"/>
  <text x="480" y="50" text-anchor="middle" class="t">OpenCode 模型路由</text>

  <rect x="60" y="90" width="200" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" class="l">agent.harness.yaml</text>
  <text x="160" y="140" text-anchor="middle" class="d">engine: opencode</text>

  <polygon points="340,110 440,150 340,190 240,150" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="152" text-anchor="middle" class="l" font-size="12">model?</text>

  <line x1="260" y1="150" x2="252" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="240" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="180" y="265" text-anchor="middle" class="l">CloudBase AI（默认）</text>
  <text x="180" y="288" text-anchor="middle" class="d">省略 model 或 model: hy3</text>

  <line x1="300" y1="190" x2="300" y2="225" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="300" y1="225" x2="180" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <rect x="360" y="240" width="260" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="490" y="265" text-anchor="middle" class="l">自有模型</text>
  <text x="490" y="288" text-anchor="middle" class="d">model.provider + model.id + apiKey</text>

  <line x1="380" y1="190" x2="490" y2="232" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="130" width="200" height="60" rx="8" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <text x="800" y="158" text-anchor="middle" class="l" fill="#ffffff">OpenCode</text>
  <text x="800" y="178" text-anchor="middle" class="d" fill="#c7d2fe">沙箱内运行 / zen 模式</text>

  <line x1="490" y1="160" x2="692" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

</svg>