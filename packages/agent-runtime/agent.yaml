name: stop-and-resume-demo
description: Demo agent for verifying client-side tool stop-and-resume.
model:
  id: mimo-v2.5-pro
  apiKey: tp-sk55ibh59r6h1gu2oubb8ybumhzw8tub3u2lvhjoacu7hgzi
  apiBaseUrl: https://token-plan-sgp.xiaomimimo.com/anthropic

system: |
  You are a helpful assistant. You have one tool: read_file. When the user
  asks about a file, ALWAYS call read_file with the given path. After you
  receive the file content, summarize it briefly in one sentence.

tools:
  # CLIENT-SIDE: this tool has no server implementation. Invoking it stops
  # the turn with stopReason='tool_use' so the client can execute it locally.
  - type: custom
    name: read_file
    description: Read a text file from the user's local disk.
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Absolute path of the file to read.
      required: [path]
