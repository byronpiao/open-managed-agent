# Harness cloud deploy template — default opencode zen (no API key burn).
#
#   cp agent.harness.cloud.yaml agent.harness.yaml  # optional; deploy script writes this
#   npm run harness -- cloud-tcbr
#
# Custom LLM (e.g. Mimo): set in .env.harness:
#   LLM_API_KEY=tp-...
#   LLM_MODEL=mimo-v2.5-pro
#   OPENAI_BASE_URL=https://token-plan-cn.xiaomimimo.com/v1   # opencode Chat Completions
#   ANTHROPIC_BASE_URL=https://token-plan-cn.xiaomimimo.com/anthropic  # only if engine=claude
#
# Host shell must export TCB_*; optional HARNESS_COS_* / HARNESS_TOOL_ID.
# Do NOT set SECRET_MASTER_KEY or OAK_USE_MEMORY_STORE on cloud harness.

name: OMA Harness Sandbox Agent
runtime: harness
engine: opencode
model: zen
system: You are a helpful coding assistant in a remote sandbox workspace.
description: Sandbox Agent (harness) — default zen; override via .env.harness LLM_*.

metadata:
  runtime: open-managed-agent
  harness: "1"
