# Harness cloud deploy template — copy and fill model.apiKey before magent agent:create/update.
#   cp agent.harness.cloud.yaml agent.harness.yaml  # gitignored if you add secrets
#
#   magent agent:create -n "OMA-Harness" --type tcbr --runtime harness --engine opencode \
#     -f ./agent.harness.yaml -e "$CLOUDBASE_ENV_ID"
#
# Host shell must also export: TCB_*, LLM_* (or model below), optional HARNESS_COS_* / HARNESS_TOOL_ID.
# Do NOT set SECRET_MASTER_KEY or OAK_USE_MEMORY_STORE on cloud harness.

name: OMA Harness Sandbox Agent
runtime: harness
engine: opencode
model:
  id: mimo-v2.5
  # apiKey: <from LLM_API_KEY at deploy time>
  apiBaseUrl: https://token-plan-cn.xiaomimimo.com/anthropic
system: You are a helpful coding assistant in a remote sandbox workspace.
description: Sandbox Agent (harness runtime) with opencode ACP in AGS magent image.

metadata:
  runtime: open-managed-agent
  harness: "1"
